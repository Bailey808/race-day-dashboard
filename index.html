<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Day Intelligence | Laura Bailey</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Oswald:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f6f1; font-family: 'DM Sans', sans-serif; font-size: 16px; }
    input[type=range] { width: 100%; cursor: pointer; }
    button { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    const STRAVA_CLIENT_ID = "230220";
    const STRAVA_CLIENT_SECRET = "917e437903069e4125c34c7f562864a5f5ad39e4";
    const STRAVA_AUTH_CODE = "dde6185a6e8a62e0b230999c9192fb8505f21d80";
    const RACE_DATE = new Date("2026-05-31T09:00:00");
    const PB_SECS = 7320;
    const VFLY_TARGET = 25;

    // ── DESIGN TOKENS ──────────────────────────────────────────────────────
    const C = {
      bg:"#f8f6f1", card:"#ffffff",
      gold:"#B8982A", goldL:"#F4EBC8", goldD:"#8A7010",
      green:"#1A7A47", greenL:"#E8F5EE",
      amber:"#C96000", amberL:"#FFF2E5",
      red:"#C42B2B", redL:"#FDEAEA",
      pink:"#B83A62", pinkL:"#FCEEF4",
      text:"#1a1a1a", mid:"#444444", muted:"#888888",
      border:"#e4dfd4", borderL:"#eeead f",
      shadow:"0 2px 20px rgba(0,0,0,0.06)",
      shadowG:"0 4px 28px rgba(184,152,42,0.22)",
      fR:"'Raleway',sans-serif",
      fN:"'Oswald','Arial Narrow',sans-serif",
      fB:"'DM Sans',sans-serif"
    };
    const sc = {green:C.green, amber:C.amber, red:C.red};
    const sb = {green:C.greenL, amber:C.amberL, red:C.redL};

    // ── UTILS ──────────────────────────────────────────────────────────────
    const spk = mps => {
      if(!mps) return "--:--";
      const s = 1000/mps;
      return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
    };
    const sts = s => {
      const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
      return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    };
    const daysTo = d => Math.ceil((d - new Date()) / 86400000);

    const strPost = b => fetch("https://www.strava.com/oauth/token", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)
    }).then(r => r.json());

    const getActs = t => fetch("https://www.strava.com/api/v3/athlete/activities?per_page=50", {
      headers:{Authorization:`Bearer ${t}`}
    }).then(r => r.json());

    const wkStats = acts => {
      const cut = Date.now() - 7*86400000;
      const runs = acts.filter(a => a.type==="Run" && new Date(a.start_date) > cut);
      const km = runs.reduce((s,r) => s + r.distance/1000, 0);
      const cads = runs.filter(r => r.average_cadence).map(r => r.average_cadence*2);
      return { runs, km, cad: cads.length ? cads.reduce((a,b)=>a+b,0)/cads.length : 0, count: runs.length };
    };

    const calcACWR = acts => {
      const now = Date.now();
      const runs = acts.filter(a => a.type==="Run");
      const ac = runs.filter(a => now-new Date(a.start_date) < 7*86400000).reduce((s,r) => s+r.distance/1000, 0);
      const ch = runs.filter(a => now-new Date(a.start_date) < 28*86400000).reduce((s,r) => s+r.distance/1000, 0) / 4;
      return { ratio: ch>0 ? ac/ch : 1.0, ac, ch };
    };

    const predict = acts => {
      const r = acts.filter(a => a.type==="Run" && a.distance>3000).slice(0,8);
      if(!r.length) return null;
      return Math.round(21097.5 / (r.reduce((s,x) => s+x.average_speed,0)/r.length * 1.04));
    };

    const DEMO = [
      {type:"Run",name:"Morning Run",distance:6200,average_speed:2.78,average_cadence:84,start_date:new Date(Date.now()-86400000).toISOString()},
      {type:"Run",name:"Easy Recovery",distance:4800,average_speed:2.65,average_cadence:82,start_date:new Date(Date.now()-3*86400000).toISOString()},
      {type:"Run",name:"Tempo Run",distance:7500,average_speed:2.92,average_cadence:86,start_date:new Date(Date.now()-5*86400000).toISOString()},
      {type:"Run",name:"Long Run",distance:12000,average_speed:2.71,average_cadence:83,start_date:new Date(Date.now()-8*86400000).toISOString()},
      {type:"Run",name:"Morning Run",distance:5500,average_speed:2.74,average_cadence:83,start_date:new Date(Date.now()-10*86400000).toISOString()},
    ];

    // ── COMPONENTS ─────────────────────────────────────────────────────────
    const Card = ({children, gold, pink, style={}}) => (
      <div style={{
        background: C.card,
        border: `1px solid ${gold ? C.gold+"99" : pink ? C.pink+"55" : C.border}`,
        borderRadius: 18, padding: "20px 22px",
        boxShadow: gold ? C.shadowG : C.shadow, ...style
      }}>{children}</div>
    );

    const STitle = ({children, color}) => (
      <h2 style={{fontFamily:C.fR, fontSize:24, fontWeight:700, color:color||C.text, marginBottom:18, letterSpacing:"-0.2px"}}>
        {children}
      </h2>
    );

    const CTitle = ({children, color}) => (
      <div style={{fontFamily:C.fR, fontSize:11, fontWeight:700, letterSpacing:1.8, color:color||C.muted, textTransform:"uppercase", marginBottom:10}}>
        {children}
      </div>
    );

    const Big = ({n, unit, color, size=48}) => (
      <div style={{display:"flex", alignItems:"baseline", gap:5}}>
        <span style={{fontFamily:C.fN, fontSize:size, fontWeight:400, color:color||C.text, lineHeight:1}}>{n}</span>
        {unit && <span style={{fontFamily:C.fB, fontSize:13, color:C.muted}}>{unit}</span>}
      </div>
    );

    const Bar = ({pct, color=C.gold, bg=C.goldL}) => (
      <div style={{height:8, background:bg, borderRadius:4}}>
        <div style={{height:"100%", width:`${Math.min(100,Math.max(0,pct))}%`, background:color, borderRadius:4, transition:"width 1.2s ease"}}/>
      </div>
    );

    const Pill = ({children, color=C.gold, bg=C.goldL}) => (
      <span style={{display:"inline-flex", alignItems:"center", padding:"5px 14px", background:bg, color, borderRadius:20, fontSize:12, fontWeight:600, fontFamily:C.fB}}>
        {children}
      </span>
    );

    const Dot = ({s}) => (
      <span style={{display:"inline-block", width:9, height:9, borderRadius:"50%", background:sc[s]||C.amber, marginRight:7}}/>
    );

    const Divider = () => <div style={{height:1, background:C.borderL, margin:"10px 0"}}/>;

    const BodyText = ({children, size=14, color, style={}}) => (
      <div style={{fontFamily:C.fB, fontSize:size, color:color||C.mid, lineHeight:1.7, ...style}}>{children}</div>
    );

    const Gauge = ({val}) => {
      const r=52, ci=2*Math.PI*r;
      const col = val>=70 ? C.green : val>=50 ? C.amber : C.red;
      const bg  = val>=70 ? C.greenL : val>=50 ? C.amberL : C.redL;
      return (
        <div style={{position:"relative", width:140, height:140}}>
          <svg width={140} height={140} style={{transform:"rotate(-90deg)"}}>
            <circle cx={70} cy={70} r={r} fill="none" stroke={bg} strokeWidth={10}/>
            <circle cx={70} cy={70} r={r} fill="none" stroke={col} strokeWidth={10}
              strokeDasharray={ci} strokeDashoffset={ci-(val/100)*ci}
              strokeLinecap="round" style={{transition:"stroke-dashoffset 1.2s ease"}}/>
          </svg>
          <div style={{position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
            <span style={{fontFamily:C.fN, fontSize:40, color:col, lineHeight:1}}>{val}</span>
            <span style={{fontFamily:C.fB, fontSize:12, color:C.muted, marginTop:3}}>/100</span>
          </div>
        </div>
      );
    };

    // ── MAIN APP ───────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab]       = useState("command");
      const [acts, setActs]     = useState([]);
      const [strava, setStrava] = useState("loading");
      const [note, setNote]     = useState("");
      const [genNote, setGenNote] = useState(false);
      const [data, setData] = useState({
        nightFeeds:2, hrv:45, bodyBattery:62, sleepScore:68,
        vaporMiles:0, pelvic:"green", calcium:800, vitD:12,
        book:"Atomic Habits — James Clear"
      });

      const save = updates => {
        const next = {...data, ...updates};
        setData(next);
        try { localStorage.setItem("rd_v8", JSON.stringify(next)); } catch(e) {}
      };

      useEffect(() => {
        try { const d=localStorage.getItem("rd_v8"); if(d) setData(JSON.parse(d)); } catch(e) {}
        try { const n=localStorage.getItem("rd_note"); if(n) setNote(n); } catch(e) {}
        (async () => {
          let rt = localStorage.getItem("rd_rt");
          const storeRt = t => { try { localStorage.setItem("rd_rt", t); } catch(e) {} };
          if(rt) {
            try {
              const r = await strPost({client_id:STRAVA_CLIENT_ID, client_secret:STRAVA_CLIENT_SECRET, grant_type:"refresh_token", refresh_token:rt});
              if(r.access_token) {
                storeRt(r.refresh_token);
                const a = await getActs(r.access_token);
                if(Array.isArray(a) && a.length) { setActs(a); setStrava("live"); return; }
              }
            } catch(e) {}
          }
          try {
            const r = await strPost({client_id:STRAVA_CLIENT_ID, client_secret:STRAVA_CLIENT_SECRET, code:STRAVA_AUTH_CODE, grant_type:"authorization_code"});
            if(r.access_token) {
              storeRt(r.refresh_token);
              const a = await getActs(r.access_token);
              if(Array.isArray(a)) { setActs(a); setStrava("live"); return; }
            }
          } catch(e) {}
          setActs(DEMO); setStrava("demo");
        })();
      }, []);

      // Computed
      const days  = daysTo(RACE_DATE);
      const wk    = wkStats(acts);
      const aw    = calcACWR(acts);
      const predS = predict(acts) || PB_SECS + 300;
      const onPB  = predS < PB_SECS;
      const awS   = aw.ratio<0.8 ? "amber" : aw.ratio<=1.3 ? "green" : aw.ratio<=1.5 ? "amber" : "red";
      const rRun  = acts.filter(a => a.type==="Run")[0];
      const mumTax = (1 - data.sleepScore/100)*0.08 + data.nightFeeds*0.015;
      const rawPace = rRun ? spk(rRun.average_speed) : "--:--";
      const adjPace = rRun ? spk(rRun.average_speed*(1+mumTax)) : "--:--";
      const conf = Math.min(100, Math.round(
        (aw.ratio>=0.8&&aw.ratio<=1.3?20:10) + (data.sleepScore/100)*15 + (data.bodyBattery/100)*15 +
        (data.pelvic==="green"?10:data.pelvic==="amber"?5:0) + Math.max(0,10-data.nightFeeds*2) +
        Math.min(15,(data.vaporMiles/VFLY_TARGET)*15) + (days>21?15:days>14?12:days>7?8:5)
      ));

      const genCoach = async () => {
        setGenNote(true);
        try {
          const rs = acts.filter(a=>a.type==="Run").slice(0,4).map(r=>`${(r.distance/1000).toFixed(1)}km @ ${spk(r.average_speed)}/km`).join("; ");
          const prompt = `You are Tony Horton from P90X. Write a coaching note (max 5 sentences) for Laura, a 6-month postpartum runner (C-section, breastfeeding) targeting a half marathon PB of 2:02:00 on 31 May 2026. Stats: ${days} days to race | Confidence: ${conf}/100 | This week: ${wk.km.toFixed(1)}km | ACWR: ${aw.ratio.toFixed(2)} | Sleep: ${data.sleepScore}/100 | Body Battery: ${data.bodyBattery} | Night feeds: ${data.nightFeeds} | Predicted: ${sts(predS)} | Book: ${data.book}. Be unmistakably Tony Horton. Acknowledge the mum-athlete dual load. ONE concrete focus this week.`;
          const r = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({model:"claude-sonnet-4-20250514", max_tokens:1000, messages:[{role:"user",content:prompt}]})
          });
          const d = await r.json();
          const t = d.content?.[0]?.text || "BRING IT, Laura!";
          setNote(t); localStorage.setItem("rd_note", t);
        } catch(e) { setNote("Connection error — but you're already doing the impossible. Bring it!"); }
        setGenNote(false);
      };

      return <div style={{minHeight:"100vh", background:C.bg, paddingBottom:80}}>

        {/* HEADER */}
        <div style={{background:C.card, borderBottom:`1px solid ${C.border}`, padding:"22px 18px 20px", boxShadow:C.shadow}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:18}}>
            <div>
              <div style={{fontFamily:C.fR, fontSize:11, fontWeight:700, letterSpacing:2.5, color:C.gold, textTransform:"uppercase", marginBottom:6}}>
                Race Day Intelligence
              </div>
              <div style={{fontFamily:C.fR, fontSize:32, fontWeight:800, color:C.text, lineHeight:1.1, letterSpacing:"-0.5px"}}>
                Laura Bailey
              </div>
              <div style={{fontFamily:C.fB, fontSize:13, color:C.muted, marginTop:7, display:"flex", alignItems:"center"}}>
                {strava==="live"   ? <><Dot s="green"/><span style={{color:C.green, fontWeight:600}}>Strava Connected</span></>
                :strava==="demo"   ? <><Dot s="amber"/><span style={{color:C.amber, fontWeight:600}}>Demo Mode</span></>
                : <span>Connecting...</span>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:C.fR, fontSize:10, fontWeight:600, letterSpacing:2, color:C.muted, textTransform:"uppercase", marginBottom:2}}>Race Day In</div>
              <div style={{fontFamily:C.fN, fontSize:60, color:days<=14?C.amber:C.gold, lineHeight:1}}>{days}</div>
              <div style={{fontFamily:C.fR, fontSize:10, fontWeight:600, color:C.muted, textTransform:"uppercase", letterSpacing:2}}>Days</div>
            </div>
          </div>
          <div>
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:7}}>
              <span style={{fontFamily:C.fR, fontSize:12, fontWeight:600, color:C.muted}}>Race Confidence</span>
              <span style={{fontFamily:C.fN, fontSize:18, color:C.gold}}>{conf}<span style={{fontSize:12, fontFamily:C.fB, color:C.muted, fontWeight:400}}>/100</span></span>
            </div>
            <div style={{height:7, background:C.borderL, borderRadius:4}}>
              <div style={{height:"100%", width:`${conf}%`, background:`linear-gradient(90deg,${C.gold},${conf>=70?C.green:C.amber})`, borderRadius:4, transition:"width 1.5s ease"}}/>
            </div>
          </div>
        </div>

        {/* NAV */}
        <div style={{display:"flex", background:C.card, borderBottom:`1px solid ${C.border}`, position:"sticky", top:0, zIndex:9, overflowX:"auto"}}>
          {[{id:"command",label:"Command"},{id:"training",label:"Training"},{id:"mum",label:"Mum Hub"},{id:"fuel",label:"Fuel & Mind"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              flex:"0 0 auto", padding:"14px 18px",
              fontFamily:C.fR, fontSize:13, fontWeight:tab===t.id?700:500,
              background:"none", border:"none",
              borderBottom:`2.5px solid ${tab===t.id?C.gold:"transparent"}`,
              color:tab===t.id?C.gold:C.muted, cursor:"pointer", whiteSpace:"nowrap"
            }}>{t.label}</button>
          ))}
        </div>

        <div style={{padding:"20px 16px"}}>

          {/* ── COMMAND ── */}
          {tab==="command" && <>
            <STitle color={C.gold}>Race Command Centre</STitle>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14}}>
              <Card style={{borderColor:onPB?C.green+"99":C.amber+"99", boxShadow:`0 4px 24px ${onPB?C.green:C.amber}22`}}>
                <CTitle color={onPB?C.green:C.amber}>Predicted Finish</CTitle>
                <Big n={sts(predS)} size={26} color={onPB?C.green:C.amber}/>
                <div style={{marginTop:10}}>
                  <Pill color={onPB?C.green:C.amber} bg={onPB?C.greenL:C.amberL}>
                    {onPB ? "PB on track" : `${Math.round((predS-PB_SECS)/60)}min off`}
                  </Pill>
                </div>
                <BodyText size={12} color={C.muted} style={{marginTop:8}}>Target: 2:01:59</BodyText>
              </Card>
              <Card>
                <CTitle>Confidence</CTitle>
                <div style={{display:"flex", justifyContent:"center", paddingTop:4}}><Gauge val={conf}/></div>
              </Card>
            </div>

            <Card style={{marginBottom:14}}>
              <CTitle>Vaporfly Next%2 Break-In</CTitle>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
                <Big n={data.vaporMiles} unit={`/ ${VFLY_TARGET} miles`} size={32} color={C.gold}/>
                <Pill>{data.vaporMiles<5?"Start this week":data.vaporMiles<15?"Building":"Race ready"}</Pill>
              </div>
              <Bar pct={(data.vaporMiles/VFLY_TARGET)*100}/>
              <div style={{display:"flex", gap:6, marginTop:12}}>
                {[0,5,10,15,20,25].map(v=>(
                  <button key={v} onClick={()=>save({vaporMiles:v})} style={{
                    flex:1, padding:"9px 0", fontFamily:C.fB, fontSize:11,
                    fontWeight:data.vaporMiles>=v?600:400,
                    background:data.vaporMiles>=v?C.gold:C.bg,
                    color:data.vaporMiles>=v?"#fff":C.muted,
                    border:`1.5px solid ${data.vaporMiles>=v?C.gold:C.border}`,
                    borderRadius:7, cursor:"pointer", transition:"all 0.15s"
                  }}>{v}</button>
                ))}
              </div>
            </Card>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:14}}>
              {[{l:"This Week",v:wk.km.toFixed(1),u:"km"},{l:"Sessions",v:wk.count,u:"runs"},{l:"Weeks Left",v:Math.ceil(days/7),u:"weeks",c:C.gold}].map(({l,v,u,c})=>(
                <Card key={l}>
                  <CTitle>{l}</CTitle>
                  <Big n={v} size={30} color={c}/>
                  <BodyText size={12} color={C.muted} style={{marginTop:3}}>{u}</BodyText>
                </Card>
              ))}
            </div>

            {strava==="demo" && <Card style={{borderColor:C.amber+"99", marginBottom:14}}>
              <CTitle color={C.amber}>Reconnect Strava</CTitle>
              <BodyText style={{marginBottom:10}}>Auth code expired. Visit this URL then paste the redirect URL into Claude:</BodyText>
              <div style={{background:C.bg, border:`1px solid ${C.border}`, padding:12, borderRadius:8, fontSize:11, color:C.muted, wordBreak:"break-all", lineHeight:1.8, fontFamily:"monospace"}}>
                https://www.strava.com/oauth/authorize?client_id=230220&response_type=code&redirect_uri=http://localhost&approval_prompt=force&scope=activity:read_all
              </div>
            </Card>}

            {days<=7 && <Card gold>
              <CTitle color={C.gold}>Race Week Checklist</CTitle>
              {["Vaporflys clean and packed","Pump before race gun","Garmin charged and plan loaded","Electrolyte belt packed","Race nutrition prepped","Easy 20-min shakeout Thursday","Rest day Friday","Early bed Saturday night"].map((item,i,arr)=>(
                <div key={i} style={{display:"flex", gap:12, padding:"9px 0", borderBottom:i<arr.length-1?`1px solid ${C.borderL}`:"none", alignItems:"center"}}>
                  <span style={{color:C.gold, fontWeight:700, fontSize:16}}>▹</span>
                  <BodyText>{item}</BodyText>
                </div>
              ))}
            </Card>}
          </>}

          {/* ── TRAINING ── */}
          {tab==="training" && <>
            <STitle>Training Intelligence</STitle>

            <Card style={{marginBottom:14}}>
              <CTitle>Acute:Chronic Workload Ratio — Injury Risk</CTitle>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:14}}>
                <div>
                  <Big n={aw.ratio.toFixed(2)} size={52} color={sc[awS]}/>
                  <div style={{marginTop:10}}>
                    <Pill color={sc[awS]} bg={sb[awS]}><Dot s={awS}/>{awS==="green"?"Sweet spot":awS==="amber"?"Monitor carefully":"Reduce load now"}</Pill>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <BodyText size={13} color={C.mid}>Acute: {aw.ac.toFixed(1)}km</BodyText>
                  <BodyText size={13} color={C.mid}>Chronic: {aw.ch.toFixed(1)}km/wk</BodyText>
                  <BodyText size={12} color={C.muted} style={{marginTop:4}}>0.8–1.3 = safe zone</BodyText>
                </div>
              </div>
              <div style={{height:10, background:C.borderL, borderRadius:5, position:"relative"}}>
                <div style={{position:"absolute", left:"20%", height:"100%", width:"46%", background:C.greenL, borderRadius:3}}/>
                <div style={{
                  position:"absolute", top:"50%", transform:"translate(-50%,-50%)",
                  left:`${Math.min(94,Math.max(4,((aw.ratio-0.5)/1.5)*100))}%`,
                  width:16, height:16, borderRadius:"50%", background:sc[awS],
                  border:"2px solid #fff", boxShadow:`0 2px 8px ${sc[awS]}55`, transition:"left 1s ease"
                }}/>
              </div>
              <div style={{display:"flex", justifyContent:"space-between", marginTop:7}}>
                {["0.5","0.8","1.3","1.5","2.0"].map(v=><BodyText key={v} size={11} color={C.muted}>{v}</BodyText>)}
              </div>
            </Card>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14}}>
              <Card>
                <CTitle>Cadence</CTitle>
                <Big n={wk.cad>0?Math.round(wk.cad):"--"} unit="spm" color={wk.cad>=170?C.green:C.amber} size={38}/>
                <div style={{marginTop:10}}><Bar pct={wk.cad>0?(wk.cad/185)*100:0} color={wk.cad>=170?C.green:C.amber} bg={wk.cad>=170?C.greenL:C.amberL}/></div>
                <BodyText size={12} color={C.muted} style={{marginTop:5}}>Target: 170+ spm</BodyText>
              </Card>
              <Card>
                <CTitle>Body Battery</CTitle>
                <Big n={data.bodyBattery} unit="/100" color={data.bodyBattery>=60?C.green:C.amber} size={38}/>
                <div style={{marginTop:10}}><Bar pct={data.bodyBattery} color={data.bodyBattery>=60?C.green:C.amber} bg={data.bodyBattery>=60?C.greenL:C.amberL}/></div>
                <input type="range" min={0} max={100} value={data.bodyBattery} onChange={e=>save({bodyBattery:+e.target.value})} style={{marginTop:8, accentColor:C.gold}}/>
              </Card>
            </div>

            <Card style={{marginBottom:14}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
                <CTitle>Recent Runs</CTitle>
                {strava==="demo" && <Pill color={C.amber} bg={C.amberL}>Demo Data</Pill>}
              </div>
              {acts.filter(a=>a.type==="Run").slice(0,5).map((r,i,arr)=>(
                <div key={i}>
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0"}}>
                    <div>
                      <BodyText size={14}>{r.name}</BodyText>
                      <BodyText size={12} color={C.muted} style={{marginTop:3}}>
                        {new Date(r.start_date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
                      </BodyText>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontFamily:C.fN, fontSize:20, color:C.gold, lineHeight:1}}>{(r.distance/1000).toFixed(1)} km</div>
                      <BodyText size={12} color={C.muted} style={{marginTop:3}}>{spk(r.average_speed)}/km</BodyText>
                    </div>
                  </div>
                  {i<arr.length-1 && <Divider/>}
                </div>
              ))}
            </Card>

            <Card style={{marginBottom:14}}>
              <CTitle>Recovery Inputs — Update from Garmin</CTitle>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10}}>
                {[["hrv","HRV"],["bodyBattery","Body Battery"],["sleepScore","Sleep"]].map(([k,l])=>(
                  <div key={k}>
                    <BodyText size={12} color={C.muted} style={{marginBottom:7}}>{l}</BodyText>
                    <input type="number" value={data[k]} onChange={e=>save({[k]:+e.target.value})}
                      style={{width:"100%", background:C.bg, border:`1.5px solid ${C.border}`, color:C.text, padding:"9px 10px", borderRadius:8, fontFamily:C.fN, fontSize:20, outline:"none"}}/>
                  </div>
                ))}
              </div>
            </Card>

            <Card gold>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14}}>
                <div>
                  <CTitle color={C.gold}>Tony Horton AI Coach</CTitle>
                  <div style={{fontFamily:C.fR, fontSize:17, fontWeight:700, color:C.text}}>Your Weekly Coaching Note</div>
                </div>
                <button onClick={genCoach} disabled={genNote} style={{
                  padding:"10px 16px", fontFamily:C.fR, fontSize:12, fontWeight:700,
                  background:genNote?C.bg:C.gold, color:genNote?C.muted:"#fff",
                  border:`1.5px solid ${genNote?C.border:C.gold}`, borderRadius:8,
                  cursor:"pointer", boxShadow:genNote?"none":C.shadowG, whiteSpace:"nowrap"
                }}>
                  {genNote ? "Generating..." : "Generate"}
                </button>
              </div>
              {note
                ? <div style={{fontFamily:C.fB, fontSize:14, lineHeight:1.8, color:C.text, borderLeft:`3px solid ${C.gold}`, background:C.goldL, padding:"14px 14px 14px 18px", borderRadius:"0 8px 8px 0", fontStyle:"italic"}}>{note}</div>
                : <BodyText color={C.muted}>Tap Generate for your weekly Tony Horton coaching brief based on your live data.</BodyText>
              }
            </Card>
          </>}

          {/* ── MUM HUB ── */}
          {tab==="mum" && <>
            <div style={{fontFamily:C.fR, fontSize:24, fontWeight:800, color:C.pink, marginBottom:6}}>The Mum Hub</div>
            <BodyText size={11} color={C.muted} style={{marginBottom:20, textTransform:"uppercase", letterSpacing:1.5}}>
              Running a race + fuelling a human. Both count.
            </BodyText>

            <Card pink style={{marginBottom:14}}>
              <CTitle color={C.pink}>The Mum Tax Calculator</CTitle>
              <div style={{display:"grid", gridTemplateColumns:"1fr auto 1fr", gap:10, alignItems:"center", marginTop:12}}>
                <div style={{background:C.bg, padding:"14px 10px", borderRadius:12, textAlign:"center"}}>
                  <BodyText size={11} color={C.muted} style={{textTransform:"uppercase", letterSpacing:1.5, marginBottom:6}}>Actual Pace</BodyText>
                  <Big n={rawPace} unit="/km" size={26} color={C.text}/>
                </div>
                <div style={{color:C.muted, fontSize:20, fontFamily:C.fR}}>to</div>
                <div style={{background:C.pinkL, padding:"14px 10px", borderRadius:12, textAlign:"center"}}>
                  <BodyText size={11} color={C.pink} style={{textTransform:"uppercase", letterSpacing:1.5, marginBottom:6}}>Mum-Tax Adj.</BodyText>
                  <Big n={adjPace} unit="/km" size={26} color={C.pink}/>
                </div>
              </div>
              <BodyText style={{marginTop:12}}>
                Without {data.nightFeeds} night feed{data.nightFeeds!==1?"s":""} and sleep deficit, this is your equivalent performance. Every run is harder than it looks.
              </BodyText>
            </Card>

            <Card style={{marginBottom:14}}>
              <CTitle>Night Feeds Last Night</CTitle>
              <div style={{display:"flex", gap:8, marginTop:10}}>
                {[0,1,2,3,4,5].map(n=>(
                  <button key={n} onClick={()=>save({nightFeeds:n})} style={{
                    flex:1, padding:"13px 0", fontFamily:C.fN, fontSize:20,
                    background:data.nightFeeds===n?C.pink:C.bg,
                    color:data.nightFeeds===n?"#fff":C.muted,
                    border:`1.5px solid ${data.nightFeeds===n?C.pink:C.border}`,
                    borderRadius:9, cursor:"pointer", transition:"all 0.15s"
                  }}>{n}</button>
                ))}
              </div>
              <div style={{fontFamily:C.fB, fontSize:13, color:C.mid, marginTop:10, padding:"10px 12px", background:C.bg, borderRadius:9, lineHeight:1.6}}>
                {data.nightFeeds===0?"Full night — maximise today's session":data.nightFeeds<=2?"Manageable — stick to the plan":"High feed night — easy run or rest today"}
              </div>
            </Card>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14}}>
              <Card>
                <CTitle>Sleep Score</CTitle>
                <Big n={data.sleepScore} unit="/100" color={data.sleepScore>=70?C.green:data.sleepScore>=50?C.amber:C.red} size={36}/>
                <input type="range" min={0} max={100} value={data.sleepScore} onChange={e=>save({sleepScore:+e.target.value})} style={{marginTop:10, accentColor:C.pink}}/>
              </Card>
              <Card>
                <CTitle>Calorie Target</CTitle>
                <Big n={(2200+400+Math.round(wk.km/7*65)).toLocaleString()} unit="kcal" color={C.pink} size={26}/>
                <BodyText size={12} color={C.muted} style={{marginTop:8, lineHeight:2}}>
                  <div>Base 2,200 + BF +400</div>
                  <div>Training +{Math.round(wk.km/7*65)}</div>
                </BodyText>
              </Card>
            </div>

            <Card style={{marginBottom:14}}>
              <CTitle>Key Nutrients — Medichecks 5th May</CTitle>
              {[
                {k:"calcium", l:"Calcium", max:1300, u:"mg", c:C.pink, bg:C.pinkL},
                {k:"vitD", l:"Vitamin D", max:15, u:"μg", c:C.amber, bg:C.amberL}
              ].map(({k,l,max,u,c,bg})=>(
                <div key={k} style={{marginBottom:16}}>
                  <div style={{display:"flex", justifyContent:"space-between", marginBottom:6}}>
                    <BodyText size={13} color={C.mid}>{l}</BodyText>
                    <Pill color={c} bg={bg}>{data[k]} / {max} {u}</Pill>
                  </div>
                  <Bar pct={(data[k]/max)*100} color={c} bg={bg}/>
                  <input type="range" min={0} max={max} value={data[k]} onChange={e=>save({[k]:+e.target.value})} style={{marginTop:8, accentColor:c}}/>
                </div>
              ))}
              <div style={{fontFamily:C.fB, fontSize:13, color:C.muted, padding:"10px 12px", background:C.bg, borderRadius:9}}>
                Ferritin, TSH and B12 unlock after Medichecks on 5th May
              </div>
            </Card>

            <Card style={{marginBottom:14}}>
              <CTitle>Pelvic Floor + Core — Post C-Section, Physio Cleared</CTitle>
              <BodyText style={{marginBottom:12}}>Weekly check as training load increases.</BodyText>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8}}>
                {["green","amber","red"].map(s=>(
                  <button key={s} onClick={()=>save({pelvic:s})} style={{
                    padding:"14px 6px", fontFamily:C.fR, fontSize:12,
                    fontWeight:data.pelvic===s?700:500,
                    background:data.pelvic===s?sb[s]:C.bg,
                    border:`1.5px solid ${data.pelvic===s?sc[s]:C.border}`,
                    borderRadius:10, cursor:"pointer", color:sc[s], transition:"all 0.15s"
                  }}>
                    {s==="green"?"All Good":s==="amber"?"Monitor":"Flag it"}
                  </button>
                ))}
              </div>
            </Card>

            <Card pink>
              <CTitle color={C.pink}>Hormone Awareness Note</CTitle>
              <div style={{fontFamily:C.fB, fontSize:14, lineHeight:1.8, color:C.text, borderLeft:`3px solid ${C.pink}`, background:C.pinkL, padding:"14px 14px 14px 18px", borderRadius:"0 8px 8px 0", marginTop:12}}>
                {data.sleepScore<55
                  ? "Elevated cortisol from sleep deprivation is slowing muscle repair. Your actual effort is higher than your metrics suggest. Easy run or rest today."
                  : data.nightFeeds>=3
                  ? "Multiple feeds means high prolactin — great for milk supply, but fatigue runs deeper than your watch can measure. Trust effort over pace today."
                  : data.bodyBattery<40
                  ? "Low Body Battery combined with breastfeeding creates a double system load. Prioritise protein, sleep, and one fewer session if needed."
                  : "Recovery markers solid. Prolactin elevated as expected while feeding, cortisol manageable. Green light to train to plan today."}
              </div>
            </Card>
          </>}

          {/* ── FUEL & MIND ── */}
          {tab==="fuel" && <>
            <STitle>Fuel &amp; Mind</STitle>

            <Card gold style={{marginBottom:14}}>
              <CTitle color={C.gold}>Book Intelligence This Week</CTitle>
              <input type="text" value={data.book} onChange={e=>save({book:e.target.value})} placeholder="Current Audible / Blinkist..."
                style={{width:"100%", background:C.bg, border:`1.5px solid ${C.border}`, color:C.text, padding:"12px 14px", borderRadius:9, fontFamily:C.fB, fontSize:14, marginBottom:14, outline:"none"}}/>
              <div style={{fontFamily:C.fB, fontSize:14, lineHeight:1.8, color:C.text, borderLeft:`3px solid ${C.gold}`, background:C.goldL, padding:"14px 14px 14px 18px", borderRadius:"0 8px 8px 0"}}>
                {data.book.toLowerCase().includes("atomic")
                  ? "You don't rise to the level of your goals — you fall to the level of your systems. Every run logged, every feed survived, every fuelling choice is a vote for the identity of Laura Bailey, half marathon runner. Cast enough votes."
                  : data.book.toLowerCase().includes("goggins") || data.book.toLowerCase().includes("hurt")
                  ? "The most important conversations are the ones you have with yourself. At mile 10, when the baby was up at 3am — what story do you tell yourself? Make it the right one."
                  : data.book.toLowerCase().includes("mindset")
                  ? "Growth mindset: your abilities are not fixed. Every hard session grows your capability. The woman crossing that finish line is being built right now."
                  : "Use your run time wisely. The best athletes use aerobic training as thinking time. What insight from this book applies to your race strategy this week?"}
              </div>
            </Card>

            <Card style={{marginBottom:14}}>
              <CTitle>Race Day Fuelling Plan</CTitle>
              {[
                {t:"Night before", f:"Pasta or rice. Nothing new. 750ml water."},
                {t:"2 hours before gun", f:"Porridge + banana + honey. 500ml water. Pump."},
                {t:"30 min before", f:"Energy gel + 250ml water. Vaseline on feet."},
                {t:"Mile 4–5 (6–8km)", f:"First gel. Sip at every water station."},
                {t:"Mile 8–9 (12–14km)", f:"Second gel. Electrolyte if available."},
                {t:"Mile 11+ (17km+)", f:"Nothing new. Trust the prep. Run your race."},
                {t:"Finish line", f:"Protein + carbs within 30 min. Nurse or pump. Celebrate everything."},
              ].map((item,i,arr)=>(
                <div key={i}>
                  <div style={{display:"flex", gap:14, padding:"12px 0", alignItems:"flex-start"}}>
                    <div>
                      <div style={{fontFamily:C.fR, fontSize:10, fontWeight:700, color:C.gold, letterSpacing:1.5, textTransform:"uppercase", marginBottom:4}}>{item.t}</div>
                      <BodyText size={14}>{item.f}</BodyText>
                    </div>
                  </div>
                  {i<arr.length-1 && <Divider/>}
                </div>
              ))}
            </Card>

            <Card>
              <CTitle>AI Nutrition Analysis</CTitle>
              <BodyText style={{marginTop:8, marginBottom:14}}>
                Send Claude a photo of any meal with this prompt for instant feedback tailored to your training load and breastfeeding needs:
              </BodyText>
              <div style={{background:C.bg, border:`1.5px solid ${C.border}`, borderRadius:10, padding:16, fontFamily:C.fB, fontSize:13, color:C.mid, lineHeight:1.8, fontStyle:"italic"}}>
                "I'm breastfeeding and training for a half marathon in {daysTo(RACE_DATE)} days. Here's my meal — does this support my training and milk supply? What would you add or change?"
              </div>
            </Card>
          </>}

        </div>

        <div style={{textAlign:"center", padding:"24px 20px", fontFamily:C.fR, fontSize:11, fontWeight:500, color:C.borderL, letterSpacing:2, textTransform:"uppercase"}}>
          Race Day Intelligence — Laura Bailey — May 2026
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
